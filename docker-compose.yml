services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bronze_db
      POSTGRES_USER: shahd
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_review_password}
    volumes:
      - bronze_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shahd -d bronze_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-generator:
    build: .
    command: ["python", "data_generator.py"]
    environment:
      KAFKA_SERVER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  bronze-consumer:
    build: .
    command: ["python", "bronze_consumer.py"]
    environment:
      KAFKA_SERVER: kafka:9092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bronze_db
      DB_USER: shahd
      DB_PASSWORD: ${DB_PASSWORD:-local_review_password}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bronze_postgres_data:
